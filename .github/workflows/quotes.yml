name: Обновление котировок

on:
  # Раз в день в 19:05 МСК = 16:05 UTC, по будням.
  # После закрытия основной сессии (18:40) и аукциона закрытия (18:50),
  # когда у Мосбиржи готовы официальные цены закрытия.
  schedule:
    - cron: "5 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Версия workflow
        run: echo ">>> ВЕРСИЯ 4 <<< ежедневный снимок, ОФЗ + корпораты + индексы"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Собрать котировки
        run: python fetch_quotes.py

      - name: Закоммитить результат
        run: |
          git config user.name  "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3; do
            echo "--- попытка $i ---"
            git fetch origin "$BRANCH"
            git reset "origin/$BRANCH"

            git add quotes.json quotes.md history.csv history_index.csv cache
            if git diff --staged --quiet; then
              echo "Изменений нет, коммит не нужен"
              exit 0
            fi

            git commit -m "Котировки за $(date -u '+%Y-%m-%d')"

            if git push origin "HEAD:$BRANCH"; then
              echo "Отправлено с попытки $i"
              exit 0
            fi

            echo "Не прошло, пробую снова через 5 секунд..."
            sleep 5
          done

          echo "Не удалось отправить результат за три попытки"
          exit 1
