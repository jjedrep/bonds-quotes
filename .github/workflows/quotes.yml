name: Обновление котировок

on:
  schedule:
    - cron: "5 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Версия workflow
        run: echo ">>> ВЕРСИЯ 6 <<< облигации + акции + скринер"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Облигации
        run: python fetch_quotes.py

      - name: Акции
        run: python fetch_stocks.py
        continue-on-error: true

      # Скринер читает результаты двух предыдущих шагов.
      - name: Скринер
        run: python screener.py
        continue-on-error: true

      - name: Закоммитить результат
        run: |
          git config user.name  "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          BRANCH="${GITHUB_REF_NAME}"

          for i in 1 2 3; do
            echo "--- попытка $i ---"
            git fetch origin "$BRANCH"
            git reset "origin/$BRANCH"
            git add -A
            if git diff --staged --quiet; then
              echo "Изменений нет"
              exit 0
            fi
            git commit -m "Данные за $(date -u '+%Y-%m-%d')"
            if git push origin "HEAD:$BRANCH"; then
              echo "Отправлено с попытки $i"
              exit 0
            fi
            echo "Не прошло, пробую снова..."
            sleep 5
          done
          exit 1
